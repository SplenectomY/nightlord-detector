name: build-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tesseract
        run: choco install tesseract --yes --no-progress
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Python deps
        run: python -m pip install -r requirements.txt pytest
      - name: Tests
        run: python -m pytest -q
      - name: Freeze EXE and installer
        run: powershell -File scripts\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: nightlord-detector-windows
          path: |
            dist/nightlord-detector.exe
            dist/NightlordDetectorSetup.exe
